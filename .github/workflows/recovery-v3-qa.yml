name: Recovery V3 QA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'reports/seo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/recovery-v3-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full predeploy recovery gate
        run: npm run gate:predeploy
